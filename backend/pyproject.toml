[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytecraft-racing-backend"
version = "0.1.0"
description = "Race Engineering Agent — ByteCraft Racing backend"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",      # file upload (MoTeC .ld/.ldx)

    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",               # async postgres driver
    "alembic>=1.14.0",

    # Numerical analysis
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",

    # AI
    # Pinned to the 1.x major that is actually installed and tested against
    # (1.2.0 as of 27 Aug 2026). The old ">=0.40.0" had no upper bound and had
    # ALREADY resolved across the 0.x -> 1.x major boundary silently; this pin
    # records reality and stops the next major arriving the same way.
    "anthropic>=1.2,<2",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Utilities
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",                 # TestClient
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff (linter + formatter) ─────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

# ── mypy ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
